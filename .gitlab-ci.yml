# Создание релиза (только для тегов)
release:
  stage: release
  image: alpine:latest
  dependencies:
    - build:linux
    # - build:windows  # Раскомментируйте если используете Windows build
    # - build:macos    # Раскомментируйте если используете macOS build
  before_script:
    - apk add --no-cache tar gzip
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}..."
    - mkdir -p release
    
    # Подготовка файлов Linux
    - |
      if [ -f "dist/NDFL_Calculator" ]; then
        cp dist/NDFL_Calculator release/NDFL_Calculator-Linux
        cd release && tar -czf NDFL_Calculator-Linux.tar.gz NDFL_Calculator-Linux && cd ..
        echo "✅ Linux artifact prepared"
      fi
    
    - ls -lh release/
  artifacts:
    paths:
      - release/
    name: "NDFL_Calculator-${CI_COMMIT_TAG}"
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'  # Только для тегов версий (v1.0.0)
  release:
    tag_name: '${CI_COMMIT_TAG}'
    description: |
      Автоматическая сборка NDFL Calculator ${CI_COMMIT_TAG}
      
      **Linux версия включена**
      
      Для Windows и macOS версий используйте GitHub Actions или соберите локально.
    assets:
      links:
        - name: 'Linux версия (tar.gz)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/release/NDFL_Calculator-Linux.tar.gz?job=release'

