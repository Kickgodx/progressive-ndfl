stages:
  - build
  - release

variables:
  PYTHON_VERSION: "3.12"

# Шаблон для сборки
.build_template:
  stage: build
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pyinstaller
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
    name: "${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}"

# Сборка для Windows
build:windows:
  extends: .build_template
  image: python:${PYTHON_VERSION}-windowsservercore
  script:
    - echo "Building for Windows..."
    - python --version
    - .\build.bat
    - if (Test-Path "dist\NDFL_Calculator.exe") {
        Write-Host "✅ Build successful!";
        $size = (Get-Item "dist\NDFL_Calculator.exe").Length / 1MB;
        Write-Host "File size - $([math]::Round($size, 2)) MB"
      } else {
        Write-Host "❌ Build failed!";
        exit 1
      }
  artifacts:
    paths:
      - dist/NDFL_Calculator.exe

# Сборка для Linux
build:linux:
  extends: .build_template
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update
    - apt-get install -y python3-tk
    - python --version
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pyinstaller
  script:
    - echo "Building for Linux..."
    - python --version
    - chmod +x build.sh
    - ./build.sh
    - |
      if [ -f "dist/NDFL_Calculator" ]; then
        echo "✅ Build successful!"
        ls -lh dist/NDFL_Calculator
        file dist/NDFL_Calculator
      else
        echo "❌ Build failed!"
        exit 1
      fi
  artifacts:
    paths:
      - dist/NDFL_Calculator

# Сборка для macOS
build:macos:
  extends: .build_template
  image: python:${PYTHON_VERSION}
  script:
    - echo "Building for macOS..."
    - python --version
    - chmod +x build.sh
    - ./build.sh
    - |
      if [ -f "dist/NDFL_Calculator" ]; then
        echo "✅ Build successful!"
        ls -lh dist/NDFL_Calculator
        file dist/NDFL_Calculator
      else
        echo "❌ Build failed!"
        exit 1
      fi
  artifacts:
    paths:
      - dist/NDFL_Calculator

# Создание релиза (только для тегов)
release:
  stage: release
  image: alpine:latest
  dependencies:
    - build:windows
    - build:linux
    - build:macos
  before_script:
    - apk add --no-cache curl zip tar
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}..."
    - mkdir -p release
    
    # Подготовка файлов Windows
    - if [ -f "dist/NDFL_Calculator.exe" ]; then
        cp dist/NDFL_Calculator.exe release/NDFL_Calculator-Windows.exe;
        cd release && zip NDFL_Calculator-Windows.zip NDFL_Calculator-Windows.exe && cd ..;
      fi
    
    # Подготовка файлов Linux
    - if [ -f "dist/NDFL_Calculator" ] && [ ! -f "release/NDFL_Calculator-Linux" ]; then
        cp dist/NDFL_Calculator release/NDFL_Calculator-Linux;
        cd release && tar -czf NDFL_Calculator-Linux.tar.gz NDFL_Calculator-Linux && cd ..;
      fi
    
    # Подготовка файлов macOS
    - if [ -f "dist/NDFL_Calculator" ] && [ ! -f "release/NDFL_Calculator-macOS" ]; then
        cp dist/NDFL_Calculator release/NDFL_Calculator-macOS;
        cd release && tar -czf NDFL_Calculator-macOS.tar.gz NDFL_Calculator-macOS && cd ..;
      fi
    
    - ls -lh release/
  artifacts:
    paths:
      - release/
    name: "NDFL_Calculator-${CI_COMMIT_TAG}"
    expire_in: never
  release:
    tag_name: '${CI_COMMIT_TAG}'
    description: 'Автоматическая сборка NDFL Calculator ${CI_COMMIT_TAG}'
    assets:
      links:
        - name: 'Windows версия'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/release/NDFL_Calculator-Windows.zip?job=release'
        - name: 'Linux версия'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/release/NDFL_Calculator-Linux.tar.gz?job=release'
        - name: 'macOS версия'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/release/NDFL_Calculator-macOS.tar.gz?job=release'

