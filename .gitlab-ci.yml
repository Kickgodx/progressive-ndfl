stages:
  - build
  - release

variables:
  PYTHON_VERSION: "3.12"

# Шаблон для сборки
.build_template:
  stage: build
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pyinstaller
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
    name: "${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}"

# Сборка для Linux (основная, работает на GitLab.com shared runners)
build:linux:
  extends: .build_template
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update
    - apt-get install -y python3-tk
    - python --version
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pyinstaller
  script:
    - echo "Building for Linux..."
    - python --version
    - chmod +x build.sh build_tools/build.sh
    - ./build.sh
    - |
      if [ -f "dist/NDFL_Calculator" ]; then
        echo "✅ Build successful!"
        ls -lh dist/NDFL_Calculator
        file dist/NDFL_Calculator
      else
        echo "❌ Build failed!"
        exit 1
      fi
  artifacts:
    paths:
      - dist/NDFL_Calculator

